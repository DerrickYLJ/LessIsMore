[build-system]
requires = ["setuptools>=68", "wheel", "packaging"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal"
version = "0.0.1"
description = "Less Is More: Training-Free Sparse Attention with Global Locality"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
    # Core runtime
    "torch>=2.1,<2.6",                          # SDPA required; Flex Attention optional on >=2.5
    "transformers>=4.52,<4.53",                 # Uses flex_attention, hub kernels, new kwargs
    "tokenizers>=0.21,<0.22",
    "numpy>=1.24,<2",
    "tqdm>=4.66",
    "sentencepiece>=0.1.99",
    "huggingface-hub>=0.23,<1",
    "fsspec>=2023.6.0",
]

[project.optional-dependencies]
experiments = [
    # Evaluation and scripts
    "datasets>=2.14",
    "pyarrow>=14",
    "evaluate>=0.4",
    "matplotlib>=3.7",
    "regex>=2023.10.3",
    "absl-py>=1.4",
    "sympy>=1.12",
    "latex2sympy2>=1.0.1",
    "word2number>=1.1",
    "fuzzywuzzy>=0.18.0",
    "rouge>=1.0.1",
    "jieba>=0.42.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]
flash = [
    # Optional FlashAttention 2 (match README install flow)
    "flash-attn==2.3.0",
    "ninja>=1.11",
]
dev = [
    "pytest>=8.2",
    "packaging>=24.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]